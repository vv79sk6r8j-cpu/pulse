name: Deploy PULSE to GitHub Pages
on:
  push:
    branches: [main, feature/interface-v0.2]
  workflow_dispatch:
# Publish stable main and current preview branch together; refresh after theory article addition.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable version
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Checkout preview version
        uses: actions/checkout@v4
        with:
          ref: feature/interface-v0.2
          path: preview-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build stable website
        working-directory: stable
        run: |
          npm install
          npm install --no-save sharp
          node scripts/generate-icons.mjs
          npm run build
      - name: Build preview website
        working-directory: preview-source
        env:
          VITE_BASE: /pulse/preview/
        run: |
          npm install
          npm install --no-save sharp
          PULSE_PREVIEW=1 node ../stable/scripts/generate-icons.mjs
          npm run build
      - name: Combine stable and preview
        run: |
          mkdir -p stable/dist/preview
          cp -R preview-source/dist/. stable/dist/preview/
          touch stable/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stable/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
